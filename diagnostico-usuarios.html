<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnóstico de Usuários por Unidade</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <h1>Diagnóstico de Usuários por Unidade</h1>

    <div class="row mt-4">
        <div class="col-md-6">
            <h3>Verificar Usuário por E-mail</h3>
            <div class="input-group mb-3">
                <input type="email" class="form-control" id="emailCheck" placeholder="Digite o e-mail">
                <button class="btn btn-primary" onclick="checkUserByEmail()">Verificar</button>
            </div>
            <div id="emailResult" class="alert alert-info">Resultado aparecerá aqui</div>
        </div>

        <div class="col-md-6">
            <h3>Verificar Usuário por CPF</h3>
            <div class="input-group mb-3">
                <input type="text" class="form-control" id="cpfCheck" placeholder="Digite o CPF">
                <button class="btn btn-primary" onclick="checkUserByCPF()">Verificar</button>
            </div>
            <div id="cpfResult" class="alert alert-info">Resultado aparecerá aqui</div>
        </div>
    </div>

    <div class="row mt-4">
        <div class="col-12">
            <h3>Teste de Criação de Usuário</h3>
            <form id="createUserForm">
                <div class="row">
                    <div class="col-md-3">
                        <input type="text" class="form-control mb-2" name="nome" placeholder="Nome" required>
                    </div>
                    <div class="col-md-3">
                        <input type="email" class="form-control mb-2" name="email" placeholder="E-mail" required>
                    </div>
                    <div class="col-md-2">
                        <input type="text" class="form-control mb-2" name="cpf" placeholder="CPF">
                    </div>
                    <div class="col-md-2">
                        <input type="text" class="form-control mb-2" name="unidade_id" placeholder="Unidade ID">
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-success w-100">Criar Usuário</button>
                    </div>
                </div>
            </form>
            <div id="createResult" class="alert alert-info mt-2">Resultado da criação aparecerá aqui</div>
        </div>
    </div>

    <script>
        async function checkUserByEmail() {
            const email = document.getElementById('emailCheck').value;
            if (!email) {
                document.getElementById('emailResult').innerHTML = 'Digite um e-mail válido';
                return;
            }

            try {
                const response = await fetch(`/api/debug/user-by-email/${encodeURIComponent(email)}`);
                const data = await response.json();
                document.getElementById('emailResult').innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
            } catch (error) {
                document.getElementById('emailResult').innerHTML = `Erro: ${error.message}`;
            }
        }

        async function checkUserByCPF() {
            const cpf = document.getElementById('cpfCheck').value;
            if (!cpf) {
                document.getElementById('cpfResult').innerHTML = 'Digite um CPF válido';
                return;
            }

            try {
                const response = await fetch(`/api/debug/user-by-cpf/${encodeURIComponent(cpf)}`);
                const data = await response.json();
                document.getElementById('cpfResult').innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
            } catch (error) {
                document.getElementById('cpfResult').innerHTML = `Erro: ${error.message}`;
            }
        }

        document.getElementById('createUserForm').addEventListener('submit', async function(event) {
            event.preventDefault();

            const formData = new FormData(event.target);
            const data = {};
            for (let [key, value] of formData.entries()) {
                data[key] = value;
            }

            try {
                const response = await fetch('/api/usuarios', {
                    method: 'POST',
                    body: JSON.stringify(data),
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest'
                    }
                });

                const result = await response.json();
                document.getElementById('createResult').innerHTML = `<pre>${JSON.stringify(result, null, 2)}</pre>`;
            } catch (error) {
                document.getElementById('createResult').innerHTML = `Erro: ${error.message}`;
            }
        });
    </script>
</body>
</html>
